name: pages

on:
  push:
    branches: [main]
  pull_request:

# A reusable workflow runs with the CALLER's token permissions, so these must be
# granted here — the callee cannot add them.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  pages:
    uses: kuboon/workflows/.github/workflows/github-page-with-preview.yaml@main
    with:
      # The top page is a plain file: there is nothing to build.
      build-command: "true"
      dist-dir: site
